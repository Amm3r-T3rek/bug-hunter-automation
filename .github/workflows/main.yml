name: Daily Bug Hunter Scan

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Tools
        run: |
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Update Nuclei Templates
        run: nuclei -update-templates

      - name: Verify Templates Path
        run: |
          echo "[*] Templates directory:"
          ls $HOME/nuclei-templates/
          echo ""
          echo "[*] http templates:"
          ls $HOME/nuclei-templates/http/ | head -20

      - name: Enumerate Subdomains
        run: |
          subfinder -dL targets.txt -silent -all -o raw_subs.txt
          cat targets.txt >> raw_subs.txt
          sort -u raw_subs.txt -o raw_subs.txt
          echo "[*] Raw subdomains: $(wc -l < raw_subs.txt)"

      - name: Filter Live Hosts with httpx
        run: |
          httpx -l raw_subs.txt \
                -silent \
                -mc 200,201,202,301,302,401,403,500 \
                -threads 150 \
                -timeout 10 \
                -o subdomains.txt

          echo "[*] Live subdomains: $(wc -l < subdomains.txt)"

      - name: Run Nuclei Scan
        run: |
          echo "[*] Starting Nuclei with $(wc -l < subdomains.txt) targets"

          nuclei -l subdomains.txt \
                 -severity critical,high,medium \
                 -t "$HOME/nuclei-templates/http/cves/" \
                 -t "$HOME/nuclei-templates/http/exposures/" \
                 -t "$HOME/nuclei-templates/http/misconfiguration/" \
                 -t "$HOME/nuclei-templates/http/takeovers/" \
                 -rl 100 \
                 -c 25 \
                 -timeout 10 \
                 -retries 2 \
                 -o nuclei_report.txt \
                 -stats 2>&1 | tee nuclei_scan.log || true

          echo "[*] Report lines: $(wc -l < nuclei_report.txt 2>/dev/null || echo 0)"

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports
          path: |
            raw_subs.txt
            subdomains.txt
            nuclei_report.txt
            nuclei_scan.log
          retention-days: 30
